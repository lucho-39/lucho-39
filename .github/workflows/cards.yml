name: Update README cards

# Runs every day at 03:00 UTC (00:00 in Argentina, UTC-3).
# You can also trigger it by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Declaring any permission sets every permission that is not listed to `none`.
    # The trophy card queries user issues and pull requests through the GraphQL API,
    # so those reads have to be granted explicitly or the run fails.
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate trophy card
        uses: ryo-ma/github-profile-trophy@v1.0
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug trophy inputs
        if: always()
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "token length: ${#GITHUB_TOKEN1}"
          echo "--- raw GraphQL response with the CI token ---"
          curl -sS -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GITHUB_TOKEN1" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ user(login: \"lucho-39\") { createdAt openIssues: issues(states: OPEN) { totalCount } pullRequests(first: 1) { totalCount } } }"}' \
            | head -c 2000

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
