name: Update README cards

# Runs every day at 03:00 UTC (00:00 in Argentina, UTC-3).
# You can also trigger it by hand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Declaring any permission sets every permission that is not listed to `none`.
    # The trophy card queries user issues and pull requests through the GraphQL API,
    # so those reads have to be granted explicitly or the run fails.
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&locale=en&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The upstream v1.0 tag asks for `stargazers { totalCount }`, a connection the
      # automatic GITHUB_TOKEN is not allowed to read: the API answers FORBIDDEN
      # "Resource not accessible by integration", returns null nodes and poisons the
      # whole query. There is no `permissions` key that grants it. master replaced it
      # with the `stargazerCount` scalar, so run the fixed script from a pinned commit
      # instead of the released action.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3

      - name: Generate trophy card
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TROPHY_SHA=e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          curl -sSL "https://github.com/ryo-ma/github-profile-trophy/archive/${TROPHY_SHA}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          deno run --allow-net --allow-env --allow-read --allow-write \
            "$RUNNER_TEMP/github-profile-trophy-${TROPHY_SHA}/render_svg.ts" \
            "${{ github.repository_owner }}" "profile/trophy.svg" "default"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
